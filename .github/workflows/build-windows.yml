name: Build Windows portable

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/**"
      - "Cargo.lock"
      - "scripts/fetch-pdfium.ps1"
      - "scripts/fetch-qpdf.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch PDFium (Windows x64)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-pdfium.ps1

      - name: Fetch QPDF (Windows x64)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-qpdf.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bộ font Noto đóng gói theo app (phủ tiếng Việt) — hiển thị/ghi file
      # giống nhau trên mọi máy khách, không phụ thuộc font hệ điều hành.
      - name: Cache bundled fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-fonts-${{ hashFiles('scripts/fetch-fonts.ps1') }}

      - name: Fetch bundled fonts (Noto)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-fonts.ps1

      # Test OCR cần tesseract thật (eng + vie). Chocolatey có sẵn trên runner.
      - name: Install Tesseract OCR (eng + vie)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/vie.traineddata" -OutFile "$tessdata\vie.traineddata"
          echo "FOFREEXIT_TESSERACT_PATH=C:\Program Files\Tesseract-OCR\tesseract.exe" >> $env:GITHUB_ENV

      # Máy dev không có Rust — CI là nơi duy nhất chạy test engine.
      # Fail test = fail build, không publish bản hỏng.
      # --test-threads=1: PDFium serialize qua 1 mutex toàn cục; 1 test panic
      # khi đang giữ lock sẽ poison mutex làm mọi test song song chết oan.
      # FOFREEXIT_QPDF_PATH: test chạy với cwd = thư mục crate nên không tự
      # thấy qpdf/ ở root repo (test form/qpdf cần).
      - name: Run engine tests
        run: cargo test -p ff-engine -- --test-threads=1
        env:
          FOFREEXIT_QPDF_PATH: ${{ github.workspace }}\qpdf\bin\qpdf.exe

      # FOFREEXIT_EMBED_RUNTIME: build.rs nhúng pdfium.dll + qpdf + fonts/ vào
      # exe → bản phát hành là 1 file duy nhất (app giải nén vào thư mục
      # FoFreeXit trong %LOCALAPPDATA% lúc chạy, xem src/runtime.rs).
      - name: Build release
        working-directory: app/src-tauri
        run: cargo build --release
        env:
          FOFREEXIT_EMBED_RUNTIME: "1"

      - name: Rename exe
        shell: pwsh
        run: Copy-Item "app/src-tauri/target/release/fofreexit-app.exe" "FoFreeXit.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoFreeXit-win64
          path: FoFreeXit.exe
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-build-${{ github.run_number }}
          name: "FoFreeXit cho Windows (build ${{ github.run_number }})"
          body: |
            Bản build tự động — **1 file `FoFreeXit.exe` duy nhất**, không cần cài đặt: tải về, bấm đúp để chạy, copy đi đâu cũng được.

            - Lần chạy đầu app tự giải nén thư viện đi kèm (PDFium, QPDF, font) vào thư mục `FoFreeXit` trong `%LOCALAPPDATA%` (khoảng 1 giây), không ghi gì cạnh file exe.
            - Windows có thể hiện "Windows protected your PC" (SmartScreen) vì file chưa ký số: bấm **More info → Run anyway**.
            - Cần WebView2 Runtime (có sẵn trên Windows 10/11 đã cập nhật).
            - Tuỳ chọn: OCR cần cài Tesseract OCR (kèm gói Vietnamese); xuất Word chất lượng cao / Office → PDF cần LibreOffice.

            Commit: ${{ github.sha }}
          files: FoFreeXit.exe
          # Release chính thức + "latest" để link cố định trong README
          # (releases/latest/download/...) luôn trỏ bản build mới nhất.
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
