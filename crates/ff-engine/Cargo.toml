[package]
name = "ff-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FoFreeXit engine: render/edit/io over PDFium + QPDF"

[dependencies]
ff-cos = { path = "../ff-cos" }
ff-pdmodel = { path = "../ff-pdmodel" }
anyhow.workspace = true
thiserror.workspace = true
# default-features tắt để chọn pdfium_7350 thay vì pdfium_latest(7543):
# wrapper 0.8.37 chỉ mở FPDFFormObj_RemoveObject (rút object khỏi Form
# XObject — cần cho sửa file Canva) với gate 7350/future dù binding có cả
# 7543; DLL bblanchon mới hơn là superset của API 7350 nên tương thích.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_7350", "thread_safe", "image"] }
image = "0.25"
lopdf = "0.36"
ttf-parser = "0.25"
# Phase 5 iteration 2 — chữ ký số (PKCS#7/CMS detached, RSA-SHA256):
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["builder"] }
rcgen = "0.13"
pkcs8 = { version = "0.10", features = ["pem"] }
der = "0.7"
spki = "0.7"
signature = "2"
const-oid = { version = "0.9", features = ["db"] }

[dev-dependencies]
# Dựng PDF fixture (Form XObject...) trong integration test.
lopdf = "0.36"
